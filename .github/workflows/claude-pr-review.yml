name: Claude PR Review (Frontend)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'addact/**'

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review this pull request's changes to the addact/ (frontend) codebase.
            Focus on:
            - Correctness bugs and edge cases
            - Security issues (XSS, injection, unsafe data handling)
            - Code quality, readability, and adherence to existing project conventions
            - Performance concerns

            Post your findings as a single PR review comment. Be concise and only
            flag real issues -- skip nitpicks and stylistic preferences already
            enforced by linters.
          allowed_tools: "Bash(gh pr comment:*),Bash(gh pr diff:*)"
